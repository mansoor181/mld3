# The Di4C control on DeepSTARR at M=4, the cell the DNA arm never got to run. The Di4C
# objective never touches the v2 code path, so this run is valid for both the v1 and the v2
# tables and only needs doing once. Everything here is the v1 config with the output directory
# moved onto the shared volume.

seed: 0
out_dir: ${RESULTS}/v2_nontext/deepstarr_mdlmT_di4c_M4
dataset:
  name: deepstarr
batch_size: 256
micro_batch_size: 32
num_workers: 4
lr: 6.0e-5
wd: 0.0
betas: [0.9, 0.999]
lr_schedule: constant_warmup
warmup_steps: 500
steps: 30000
log_every: 100
val_every: 1000
ckpt_every: 5000
keep_last_ckpts: 1
ema: 0.999
teacher:
  kind: mdlm
  ckpt: ${RESULTS}/mol_teacher/deepstarr_mdlm/checkpoints/last.ckpt
  dit_source: pairflow
  time_conditioning: false
  vocab_size: 6
  mask_id: 5
  hidden_size: 768
  n_blocks: 12
  n_heads: 12
  cond_dim: 128
  dropout: 0.1
distill:
  K: 4
  substeps: 8
  objective_variant: di4c
  di4c:
    latent_bsize: 4
    alpha_t: sigmoid
    alpha_const: 0.1
    distil_delta: 0.01
    T: 1024
    use_cv: true
    latent_prior: uniform
    train_nll_exact: true
model:
  dim: 768
  depth: 12
  heads: 12
  mlp_mult: 4
  latent_M: 4
  latent_last_L: 4
  time_embed_dim: 256
  tie_embeddings: false
  dropout: 0.1
  cond_dim: 128
  use_mask_prior: true
  mask_id: 5
  trunk_arch: mdlm_dit
  cond_extra_silu: false
  time_conditioning: false
  warm_start: true
  warm_start_k_noise: 0.02
  time_eps: 0.001
  schedule: loglinear
  dt_min: 0.02
  dt_max: 1.0
  router_entropy_coef: 0.1
  router_load_balance_coef: -0.1
