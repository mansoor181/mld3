# WikiText-103, M=8.
seed: 0
out_dir: ${RESULTS}/wikitext103_M8
dataset: wikitext103
steps: 200000
batch_size: 256
micro_batch_size: 32
num_workers: 4
lr: 3.0e-4
wd: 0.0
betas: [0.9, 0.999]
warmup_steps: 1000
ema: 0.9999
log_every: 100
ckpt_every: 5000
teacher:
  kind: mdlm
  ckpt: ${TEACHERS}/wikitext103_mdlm/checkpoints/last.ckpt
  vocab_size: 50258
  mask_id: 50257
distill:
  K: 4
  substeps: 4
  eta: 0.5
  horizon: [0.03125, 1.0]
  x0_coef: 1.0
  x0_rows: 0.25
model:
  dim: 768
  depth: 12
  heads: 12
  latent_M: 8
  latent_last_L: 4
  time_embed_dim: 256
  cond_dim: 128
  dropout: 0.1
  arch: mdlm
  router_entropy_coef: 0.1
