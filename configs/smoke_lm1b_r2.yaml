# Ten-step smoke of the R2 supervision rung, used to check the config plumbing rather than to
# learn anything. Everything outside the distill block matches configs/distill/smoke_lm1b.yaml.
seed: 0
out_dir: ${RESULTS}/_smoke_distill/v2_lm1b_M4_K4_r2
dataset:
  name: lm1b
batch_size: 8
micro_batch_size: 8
num_workers: 2
lr: 0.0003
wd: 0.0
betas: [0.9, 0.999]
lr_schedule: constant_warmup
warmup_steps: 2500
steps: 10
log_every: 1
val_every: 1000
ckpt_every: 10
keep_last_ckpts: 1
ema: 0.0
teacher:
  ckpt: ${TEACHERS}/track2_lm1b/lm1b_LKFx0ditpmfm_M1_seed0/ckpt_0200000.pt
distill:
  K: 4
  # substeps drops from 8 to 4 and the x0 KL sees a quarter of the rows, which is the pairing
  # tests/probe_v2_cost.py measures at 0.95x of the Di4C arm at micro-batch 32.
  substeps: 4
  time_sampling: mixed
  offgrid_frac: 0.5
  horizon: random
  horizon_range: [0.03125, 1.0]
  substep_mode: scaled
  x0_kl_coef: 1.0
  x0_kl_rows: 0.25
model:
  dim: 768
  depth: 12
  heads: 12
  mlp_mult: 4
  latent_M: 4
  latent_last_L: 4
  time_embed_dim: 256
  tie_embeddings: false
  dropout: 0.1
  cond_dim: 128
  use_mask_prior: true
  trunk_arch: mdlm_dit
  time_eps: 0.001
  schedule: loglinear
  dt_min: 0.02
  dt_max: 1.0
  router_entropy_coef: 0.1
  router_load_balance_coef: -0.1
