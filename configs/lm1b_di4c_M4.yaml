# Stage-1 cell S1-11 of docs/v2_fair_comparison_plan.md, 15k steps on LM1B.
# Di4C at M=4 on LM1B, the partner of lm1b_di4c_M1.yaml.
seed: 0
out_dir: ${RESULTS}/v2_stage1/lm1b_di4c_M4
dataset:
  name: lm1b
batch_size: 256
micro_batch_size: 32
num_workers: 4
lr: 0.0003
wd: 0.0
betas: [0.9, 0.999]
lr_schedule: constant_warmup
warmup_steps: 1000
steps: 15000
log_every: 100
val_every: 1000
ckpt_every: 5000
keep_last_ckpts: 1
ema: 0.9999
teacher:
  ckpt: ${TEACHERS}/track2_lm1b/lm1b_LKFx0ditpmfm_M1_seed0/ckpt_0200000.pt
distill:
  K: 4
  substeps: 4
  objective_variant: di4c
  di4c:
    latent_bsize: 4
    alpha_t: sigmoid
    alpha_const: 0.1
    distil_delta: 0.01
    T: 1024
    use_cv: true
    latent_prior: uniform
    train_nll_exact: true
model:
  dim: 768
  depth: 12
  heads: 12
  mlp_mult: 4
  latent_M: 4
  latent_last_L: 4
  time_embed_dim: 256
  tie_embeddings: false
  dropout: 0.1
  cond_dim: 128
  use_mask_prior: true
  trunk_arch: mdlm_dit
  time_eps: 0.001
  schedule: loglinear
  dt_min: 0.02
  dt_max: 1.0
  router_entropy_coef: 0.1
  router_load_balance_coef: -0.1
