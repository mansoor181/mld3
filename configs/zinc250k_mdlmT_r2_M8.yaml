# The R2 rung of the v2 supervision applied to ZINC-250k, M=8. This cell is the v1 run at
# ${RESULTS}/mol_distill/zinc250k_mdlmT_M8_K4_seed0
# with the objective replaced and with nothing else moved, hence reading the two side by side
# isolates what the denser supervision buys on this corpus.
#
# The v2 knobs below are the full rung. The time pair is drawn off the K grid half the time
# with a log-uniform horizon, the teacher sub-step count follows that horizon, and the
# teacher's clean-token posterior enters as a KL on a quarter of every micro-batch. The
# rollout runs at 4 sub-steps rather than the 8 the v1 runs used, which is the trade the
# WikiText-103 arm measured at 1.04x of the Di4C control against 1.29x at 8 sub-steps.

seed: 0
out_dir: ${RESULTS}/v2_nontext/zinc250k_mdlmT_r2_M8
dataset:
  name: zinc250k
batch_size: 256
micro_batch_size: 128
num_workers: 4
lr: 6.0e-5
wd: 0.0
betas: [0.9, 0.999]
lr_schedule: constant_warmup
warmup_steps: 500
steps: 30000
log_every: 100
val_every: 1000
ckpt_every: 5000
keep_last_ckpts: 1
ema: 0.999
teacher:
  kind: mdlm
  ckpt: ${RESULTS}/mol_teacher/zinc250k_mdlm/checkpoints/last.ckpt
  dit_source: pairflow
  time_conditioning: false
  vocab_size: 72
  mask_id: 2
  hidden_size: 768
  n_blocks: 12
  n_heads: 12
  cond_dim: 128
  dropout: 0.1
distill:
  K: 4
  substeps: 4
  time_sampling: mixed
  offgrid_frac: 0.5
  horizon: random
  horizon_range: [0.03125, 1.0]
  substep_mode: scaled
  x0_kl_coef: 1.0
  x0_kl_rows: 0.25
model:
  dim: 768
  depth: 12
  heads: 12
  mlp_mult: 4
  latent_M: 8
  latent_last_L: 4
  time_embed_dim: 256
  tie_embeddings: false
  dropout: 0.1
  cond_dim: 128
  use_mask_prior: true
  mask_id: 2
  trunk_arch: mdlm_dit
  cond_extra_silu: false
  time_conditioning: false
  warm_start: true
  warm_start_k_noise: 0.02
  time_eps: 0.001
  schedule: loglinear
  dt_min: 0.02
  dt_max: 1.0
  router_entropy_coef: 0.1
  router_load_balance_coef: -0.1
