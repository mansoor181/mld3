# M=8 mixture student on WikiText-103, distilled from the one-million-step MDLM baseline
# under the v2 supervision, which is the R2 rung of docs/v2_fair_comparison_plan.md. The v1
# run of this cell lives at results/wt103_distill/wikitext103_mdlmT_M8_K4_seed0 and differs
# only in the supervision and in the teacher sub-step count, hence reading the two side by
# side isolates what the denser objective buys a student that does have a mixture. The
# transition information this cell can carry is capped at log 8 nats per position.
#
# The teacher rollout runs at 4 sub-steps rather than the 8 the v1 runs used. Measured on a
# free H100 at micro-batch 32, R2 at 4 sub-steps and a quarter of the rows costs 0.327 s per
# micro-step against the Di4C arm's 0.314 s, which is 1.04x, while the same rung at 8
# sub-steps costs 0.404 s, which is 1.29x. Compute parity with the objective these students
# are measured against matters more than matching the v1 sub-step count, and the scaled
# sub-step mode below already gives longer horizons proportionally more teacher resolution.
seed: 0
out_dir: ${RESULTS}/wt103_distill_v2/wikitext103_mdlmT_r2_M8
dataset:
  name: wikitext103
batch_size: 256
micro_batch_size: 32
num_workers: 4
lr: 0.0003
wd: 0.0
betas: [0.9, 0.999]
lr_schedule: constant_warmup
warmup_steps: 1000
steps: 200000
log_every: 100
val_every: 1000
ckpt_every: 10000
keep_last_ckpts: 2
ema: 0.9999
teacher:
  kind: mdlm
  ckpt: ${TEACHERS}/baselines_text/mdlm_wikitext103/checkpoints/last.ckpt
distill:
  K: 4
  substeps: 4
  time_sampling: mixed
  offgrid_frac: 0.5
  horizon: random
  horizon_range: [0.03125, 1.0]
  substep_mode: scaled
  x0_kl_coef: 1.0
  x0_kl_rows: 0.25
model:
  dim: 768
  depth: 12
  heads: 12
  mlp_mult: 4
  latent_M: 8
  latent_last_L: 4
  time_embed_dim: 256
  tie_embeddings: false
  dropout: 0.1
  cond_dim: 128
  use_mask_prior: true
  trunk_arch: mdlm_dit
  time_eps: 0.001
  schedule: loglinear
  dt_min: 0.02
  dt_max: 1.0
  router_entropy_coef: 0.1
  router_load_balance_coef: -0.1
