# DeepSTARR regulatory DNA, 249 bp. Same PairFlow-trained teacher conventions as the molecules.
seed: 0
out_dir: ${RESULTS}/deepstarr_M8
dataset: deepstarr
steps: 30000
batch_size: 256
micro_batch_size: 32
num_workers: 4
lr: 6.0e-5
wd: 0.0
betas: [0.9, 0.999]
warmup_steps: 500
ema: 0.999
log_every: 100
ckpt_every: 5000
teacher:
  kind: mdlm
  ckpt: ${TEACHERS}/deepstarr_mdlm/checkpoints/last.ckpt
  dit_source: pairflow
  time_conditioning: false
  vocab_size: 6
  mask_id: 5
distill:
  K: 4
  substeps: 4
  eta: 0.5
  horizon: [0.03125, 1.0]
  x0_coef: 1.0
  x0_rows: 0.25
model:
  dim: 768
  depth: 12
  heads: 12
  latent_M: 8
  latent_last_L: 4
  time_embed_dim: 256
  cond_dim: 128
  dropout: 0.1
  arch: mdlm
  time_conditioning: false
  cond_extra_silu: false
  warm_start: true
  router_entropy_coef: 0.1
