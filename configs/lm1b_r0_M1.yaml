# Stage-1 cell S1-01 of docs/v2_fair_comparison_plan.md, 15k steps on LM1B.
# R0, the v1 exact-mixture objective: one transition score per step, drawn at one of the four
# grid pairs (t, s) = (j/K, (j+1)/K). This is the floor of the supervision ladder and the rung
# the published v1 numbers correspond to.
# The teacher rollout is held at 4 sub-steps on every rung of this ladder, including R0, so
# that supervision is the only axis that moves between the rungs. The v1 runs reported in the
# paper used 8, and R2 cannot afford 8 and stay inside the Di4C arm's measured cost, so
# matching the rungs to each other matters more here than matching R0 to the v1 setting.
seed: 0
out_dir: ${RESULTS}/v2_stage1/lm1b_r0_M1
dataset:
  name: lm1b
batch_size: 256
micro_batch_size: 32
num_workers: 4
lr: 0.0003
wd: 0.0
betas: [0.9, 0.999]
lr_schedule: constant_warmup
warmup_steps: 1000
steps: 15000
log_every: 100
val_every: 1000
ckpt_every: 5000
keep_last_ckpts: 1
ema: 0.9999
teacher:
  ckpt: ${TEACHERS}/track2_lm1b/lm1b_LKFx0ditpmfm_M1_seed0/ckpt_0200000.pt
distill:
  K: 4
  substeps: 4
model:
  dim: 768
  depth: 12
  heads: 12
  mlp_mult: 4
  latent_M: 1
  latent_last_L: 4
  time_embed_dim: 256
  tie_embeddings: false
  dropout: 0.1
  cond_dim: 128
  use_mask_prior: true
  trunk_arch: mdlm_dit
  time_eps: 0.001
  schedule: loglinear
  dt_min: 0.02
  dt_max: 1.0
  router_entropy_coef: 0.1
  router_load_balance_coef: -0.1
